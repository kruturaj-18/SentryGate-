version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentrygate-db
    environment:
      POSTGRES_DB: sentrygate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentrygate-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sentrygate
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SENTRYGATE_JWT_SECRET: super-secret-sentrygate-jwt-token-signing-key-32chars
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentrygate-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
