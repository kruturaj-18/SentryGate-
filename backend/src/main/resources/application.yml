spring:
  application:
    name: sentrygate-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sentrygate}
    username: ${DATABASE_USERNAME:sentrygate}
    password: ${DATABASE_PASSWORD:sentrygate}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

sentrygate:
  jwt:
    secret: ${JWT_SECRET:sentrygate-default-secret-change-in-production-must-be-long-enough}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours

  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    app-id: ${GITHUB_APP_ID:}
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:sentrygate-webhook-secret}
    api-base-url: https://api.github.com
    oauth-base-url: https://github.com

  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  demo:
    mode: ${DEMO_MODE:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.sentrygate: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
